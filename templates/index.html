<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="../static/style.css" />
    <title>Berger Web Portal</title>
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background: white;
        padding: 2rem;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        max-width: 400px;
        width: 100%;
        text-align: center;
        animation: fadeIn 1s ease-in-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .logo {
        width: 100px;
        margin-bottom: 10px;
      }
      .form-group {
        margin-bottom: 15px;
        text-align: left;
      }
      .form-group h3 {
        margin-bottom: 5px;
        font-size: 16px;
        color: #333;
      }
      input[type="text"] {
        width: 100%;
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        transition: 0.3s;
      }
      input[type="text"]:focus {
        border-color: #ff4b75;
        outline: none;
      }
      .btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #ff4b75, #ff7eb3);
        border: none;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
        transition: 0.3s;
      }
      .btn:hover {
        background: linear-gradient(135deg, #ff3b65, #ff6ea5);
      }
      .message {
        color: green;
        font-weight: bold;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="../static/berger_logo.png" alt="Lexus" class="logo" />
      <!-- {% if message %}
      <p class="message">{{ message | safe }}</p>
      {% endif %} -->
      <form action="/submit" method="POST">
        <div class="form-group">
          <h3>Customer Name</h3>
          <input type="text" name="customer" placeholder="Name of Card Owner" required />
        </div>
        <div class="form-group">
          <h3>Mobile Number</h3>
          <input type="text" name="mobile" placeholder="Mobile No." required />
        </div>
        <div class="form-group">
          <h3>Area</h3>
          <input type="text" name="HRN" placeholder="Area" required />
        </div>
        <input type="submit" value="Submit" class="btn" />
      </form>
    </div>
  </body>
</html>
