<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="../static/style.css" />
    <title>Thank You!</title>
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background: white;
        padding: 2rem;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        max-width: 450px;
        width: 100%;
        text-align: center;
        animation: fadeIn 1s ease-in-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .logo {
        width: 100px;
        margin-bottom: 10px;
      }
      h1 {
        font-size: 28px;
        color: #333;
      }
      h2 {
        font-size: 18px;
        color: #555;
        margin-top: 10px;
      }
      .btn {
        margin-top: 15px;
        padding: 10px 20px;
        background: linear-gradient(135deg, #ff4b75, #ff7eb3);
        border: none;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
        transition: 0.3s;
        text-decoration: none;
        display: inline-block;
      }
      .btn:hover {
        background: linear-gradient(135deg, #ff3b65, #ff6ea5);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="../static/logo.png" alt="Logo" class="logo" />
      <h1>Thank You!</h1>
      <h2>Thank you for using Berger Paint. Congratulations! You will get 20 Taka Cashback!</h2>
      <a href="/" class="btn">Back to Home</a>
    </div>
  </body>
</html>
